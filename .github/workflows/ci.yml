name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Une fusion automatique Dependabot (faite avec GITHUB_TOKEN) ne déclenche pas `push` : main est revalidée chaque
  # semaine quand même (mise à jour d'AGP, de Kotlin ou de detekt fusionnée sans CI sur main).
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# Sur une PR, seul le dernier push compte : on annule l'exécution précédente. Sur main, chaque fusion est validée
# pour elle-même (et publie son badge) : deux fusions rapprochées ne s'annulent pas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Un commit qui ne touche que la documentation ne relance pas Gradle. Pas de `paths-ignore` au niveau du workflow :
  # `build` est un statut requis par la protection de main, et un workflow non déclenché laisserait la PR « en
  # attente » ; un job sauté par `if:` compte comme réussi. Déclenchement manuel ou base introuvable : CI complète.
  changes:
    name: changements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Le commit touche-t-il autre chose que la documentation ?
        id: diff
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$BASE_PR" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
              || ! files="$(git diff --name-only "$base...$GITHUB_SHA" 2>/dev/null)"; then
            echo "Pas de base de comparaison : CI complète."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          # Documentation : docs/, tout *.md, licences, cartes graft.
          if echo "$files" | grep -qvE '^(docs/|graft/|COPYING|LICENSE)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Documentation seule : build et tests sautés."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Cache en écriture sur main seulement (défaut de setup-gradle) ; la clé chiffre le cache de configuration,
      # sans elle il n'est pas sauvegardé (le build marche, la configuration est seulement recalculée : ~10 s).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Deux modules : :core (Kotlin/JVM pur, `test` + `jacocoTestReport`) et :app (Android, AGP).
      # `detekt` (les deux modules) échoue sur tout problème absent des baselines (config/detekt/).
      # `--continue` : un échec de detekt n'empêche pas les tests, le lint et l'APK de tourner (et d'être rapportés).
      # `assembleRelease` (non signé : la signature se fait hors Gradle, dans release.yml) : la variante release
      # (minifiée par R8) et son lint vital sont vérifiés à chaque push, pas seulement au tag, comme ailleurs.
      - name: Tests unitaires, couverture, detekt, lint, APK debug et release
        run: ./gradlew --continue :core:test :core:jacocoTestReport testDebugUnitTest createDebugUnitTestCoverageReport detekt lintDebug assembleDebug assembleRelease

      # Rapports detekt (HTML, SARIF, XML, Markdown) par module, même en cas d'échec ; le SARIF part ensuite
      # dans GitHub code scanning (job `detekt-sarif`).
      - name: Rapports detekt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detekt-reports
          path: |
            core/build/reports/detekt/
            app/build/reports/detekt/
          if-no-files-found: ignore

      # Un dossier par module dans l'artefact : coverage/core/ (jacocoTestReport.xml + html/), coverage/app/ (report.xml + html).
      - name: Rassembler les rapports de couverture
        run: |
          set -euo pipefail
          mkdir -p coverage/core coverage/app
          cp -r core/build/reports/jacoco/test/. coverage/core/
          cp -r app/build/reports/coverage/test/debug/. coverage/app/

      - name: Taux de couverture (résumé du job)
        run: python3 .github/scripts/coverage_badge.py coverage/core/jacocoTestReport.xml coverage/app/report.xml /tmp/coverage.svg --summary "$GITHUB_STEP_SUMMARY"

      - name: Rapport de couverture (HTML + XML)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APK debug (artefact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tamacookie-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # Envoi des résultats detekt à GitHub code scanning (onglet Security). Job à part : seul à avoir
  # `security-events: write`. Tourne même si le build a échoué (c'est là que les alertes servent).
  detekt-sarif:
    name: detekt → code scanning
    needs: build
    # PR venue d'un fork : pas de jeton en écriture, on n'essaie pas. Build sauté (documentation seule) : rien à envoyer.
    if: ${{ !cancelled() && needs.build.result != 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: detekt-reports
          path: detekt

      # Chemins du SARIF relatifs à la racine du dépôt (%SRCROOT%) : rien à réécrire. Une catégorie par module.
      - name: SARIF :core
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: detekt/core/build/reports/detekt/detekt.sarif
          category: detekt-core

      - name: SARIF :app
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: detekt/app/build/reports/detekt/detekt.sarif
          category: detekt-app

  # Badge de couverture sans service externe : SVG généré depuis le rapport JaCoCo et publié sur la branche `badges`.
  coverage-badge:
    name: badge de couverture
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write    # seul job autorisé à écrire : commit du badge
    # Même groupe que le badge CVE (security.yml) : une seule écriture à la fois sur la branche badges.
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage

      # main est protégée (statut « build » requis) : le badge vit sur la branche dédiée `badges`,
      # un seul commit sans historique, jamais construite par la CI. publish-badge.sh y remplace
      # coverage.svg en gardant les autres badges (cve.svg, publié par security.yml).
      - name: Générer et publier le badge
        run: |
          set -euo pipefail
          python3 .github/scripts/coverage_badge.py coverage/core/jacocoTestReport.xml coverage/app/report.xml "$RUNNER_TEMP/coverage.svg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/publish-badge.sh "$RUNNER_TEMP/coverage.svg" coverage.svg "Badge de couverture ($GITHUB_SHA)"
