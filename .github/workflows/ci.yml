name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # Cache en écriture sur main seulement (défaut de setup-gradle) ; la clé chiffre le cache de configuration,
      # sans elle il n'est pas sauvegardé (le build marche, la configuration est seulement recalculée : ~10 s).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Deux modules : :core (Kotlin/JVM pur, `test` + `jacocoTestReport`) et :app (Android, AGP).
      # `detekt` (les deux modules) échoue sur tout problème absent des baselines (config/detekt/).
      # `--continue` : un échec de detekt n'empêche pas les tests, le lint et l'APK de tourner (et d'être rapportés).
      - name: Tests unitaires, couverture, detekt, lint et APK debug
        run: ./gradlew --no-daemon --continue :core:test :core:jacocoTestReport testDebugUnitTest createDebugUnitTestCoverageReport detekt lintDebug assembleDebug

      # Rapports detekt (HTML, SARIF, XML, Markdown) par module, même en cas d'échec ; le SARIF part ensuite
      # dans GitHub code scanning (job `detekt-sarif`).
      - name: Rapports detekt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detekt-reports
          path: |
            core/build/reports/detekt/
            app/build/reports/detekt/
          if-no-files-found: ignore

      # Un dossier par module dans l'artefact : coverage/core/ (jacocoTestReport.xml + html/), coverage/app/ (report.xml + html).
      - name: Rassembler les rapports de couverture
        run: |
          set -euo pipefail
          mkdir -p coverage/core coverage/app
          cp -r core/build/reports/jacoco/test/. coverage/core/
          cp -r app/build/reports/coverage/test/debug/. coverage/app/

      - name: Taux de couverture (résumé du job)
        run: python3 .github/scripts/coverage_badge.py coverage/core/jacocoTestReport.xml coverage/app/report.xml /tmp/coverage.svg --summary "$GITHUB_STEP_SUMMARY"

      - name: Rapport de couverture (HTML + XML)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APK debug (artefact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tamacookie-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # Envoi des résultats detekt à GitHub code scanning (onglet Security). Job à part : seul à avoir
  # `security-events: write`. Tourne même si le build a échoué (c'est là que les alertes servent).
  detekt-sarif:
    name: detekt → code scanning
    needs: build
    # PR venue d'un fork : pas de jeton en écriture, on n'essaie pas.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: detekt-reports
          path: detekt

      # Chemins du SARIF relatifs à la racine du dépôt (%SRCROOT%) : rien à réécrire. Une catégorie par module.
      - name: SARIF :core
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: detekt/core/build/reports/detekt/detekt.sarif
          category: detekt-core

      - name: SARIF :app
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: detekt/app/build/reports/detekt/detekt.sarif
          category: detekt-app

  # Badge de couverture sans service externe : SVG généré depuis le rapport JaCoCo et publié sur la branche `badges`.
  coverage-badge:
    name: badge de couverture
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write    # seul job autorisé à écrire : commit du badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage

      # main est protégée (statut « build » requis) : le badge vit sur la branche dédiée `badges`,
      # réécrite à chaque passage (un seul commit, pas d'historique) et jamais construite par la CI.
      - name: Générer et publier le badge
        run: |
          set -euo pipefail
          python3 .github/scripts/coverage_badge.py coverage/core/jacocoTestReport.xml coverage/app/report.xml "$RUNNER_TEMP/coverage.svg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit orphelin construit sans toucher à la copie de travail (pas de checkout).
          blob=$(git hash-object -w "$RUNNER_TEMP/coverage.svg")
          tree=$(printf '100644 blob %s\tcoverage.svg\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Badge de couverture ($GITHUB_SHA)")
          git push --force origin "$commit:refs/heads/badges"
