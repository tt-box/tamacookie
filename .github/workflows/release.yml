name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 1.2.0) — crée le tag v<version>"
        required: true

# Aucun droit par défaut : chaque job déclare le strict nécessaire.
permissions: {}

jobs:
  # Construit, teste, signe et vérifie l'APK — lecture seule sur le dépôt.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Les valeurs fournies par l'utilisateur passent par env: (jamais interpolées dans le script)
      - name: Version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version invalide (attendu : X.Y.Z, ex. 1.2.0)."
            exit 1
          fi
          # versionCode croissant : nombre de commits + numéro de run
          CODE=$(( $(git rev-list --count HEAD 2>/dev/null || echo 0) + RUN_NUMBER ))
          {
            echo "name=$VERSION"
            echo "tag=v$VERSION"
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # Cache en lecture seule : une release ne doit pas alimenter le cache partagé.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Tests unitaires
        run: ./gradlew --no-daemon :core:test testDebugUnitTest

      # APK et AAB non signés : construits AVANT le décodage des clés, sans aucun secret dans
      # l'environnement — ils ne peuvent pas être signés. L'APK est publié tel quel (à signer
      # soi-même) ; l'AAB est signé plus bas avec la clé d'upload du Play Store.
      - name: APK et AAB release non signés
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease \
            "-PversionName=$VERSION_NAME" \
            "-PversionCode=$VERSION_CODE"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$UNSIGNED" ] || { echo "::error::APK non signé introuvable"; exit 1; }
          AAB=app/build/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] || { echo "::error::AAB introuvable"; exit 1; }
          jarsigner -J-Duser.language=en -verify "$AAB" | grep -q '^jar is unsigned' \
            || { echo "::error::L'AAB construit sans clé est signé"; exit 1; }
          mkdir -p "$RUNNER_TEMP/unsigned"
          mv "$UNSIGNED" "$RUNNER_TEMP/unsigned/"
          mv "$AAB" "$RUNNER_TEMP/unsigned/app-release-unsigned.aab"

      # Une release n'est jamais signée avec la clé de debug : sans clé, on échoue.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.TAMACOOKIE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TAMACOOKIE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAMACOOKIE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAMACOOKIE_KEY_PASSWORD }}
        run: |
          missing=""
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || missing="$missing TAMACOOKIE_$s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets de signature manquants :$missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "TAMACOOKIE_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: APK release signé
        env:
          TAMACOOKIE_KEYSTORE_PASSWORD: ${{ secrets.TAMACOOKIE_KEYSTORE_PASSWORD }}
          TAMACOOKIE_KEY_ALIAS: ${{ secrets.TAMACOOKIE_KEY_ALIAS }}
          TAMACOOKIE_KEY_PASSWORD: ${{ secrets.TAMACOOKIE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            "-PversionName=$VERSION_NAME" \
            "-PversionCode=$VERSION_CODE"
          rm -f "$TAMACOOKIE_KEYSTORE"

      # AAB pour le Play Store : signé avec la CLÉ D'UPLOAD (RSA 4096, alias tamacookie-upload),
      # distincte de la clé des APK — le Play Store refuse une clé d'upload ECDSA. Google re-signe
      # ensuite l'app avec sa propre clé de signature (Play App Signing) avant de la distribuer.
      - name: AAB signé (clé d'upload Play)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.TAMACOOKIE_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.TAMACOOKIE_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.TAMACOOKIE_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=""
          for s in UPLOAD_KEYSTORE_BASE64 UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_ALIAS; do
            [ -n "${!s}" ] || missing="$missing TAMACOOKIE_$s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets de la clé d'upload manquants :$missing"
            exit 1
          fi
          KS="$RUNNER_TEMP/upload.p12"
          trap 'rm -f "$KS"' EXIT
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$KS"
          mkdir -p "$RUNNER_TEMP/signed"
          jarsigner -J-Duser.language=en -keystore "$KS" -storetype PKCS12 \
            -storepass:env UPLOAD_KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "$RUNNER_TEMP/signed/app-release.aab" \
            "$RUNNER_TEMP/unsigned/app-release-unsigned.aab" "$UPLOAD_KEY_ALIAS"

      # Contrôle indépendant de Gradle : signature valide et certificat épinglé
      # (ECDSA P-256, alias tamacookie-release). À mettre à jour en cas de rotation de clé.
      - name: Vérifier la signature
        env:
          EXPECTED_CERT_SHA256: 839a8f9854abb247549496a8093c8268d06f5ad30735022a3faa5664b872523d
          # Clé d'upload du Play Store (RSA 4096, CN=TamaCookie, O=tt-box).
          EXPECTED_UPLOAD_CERT_SHA256: 4a8d10047af4b8c157ab8d6657c0f94a7e88c545c52a8fd95f645291eb2cbea8
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::APK signé introuvable (app-release-unsigned ?)"; exit 1; }
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          out="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          echo "$out" | grep -E "^Verified using|certificate DN|certificate SHA-256|key algorithm|key size"
          actual="$(echo "$out" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
          [ "$actual" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::APK signé par $actual, attendu $EXPECTED_CERT_SHA256"; exit 1; }
          # AAB (format de publication du Play Store) : signature JAR par la clé d'upload.
          AAB="$RUNNER_TEMP/signed/app-release.aab"
          [ -f "$AAB" ] || { echo "::error::AAB signé introuvable"; exit 1; }
          # Pas de -strict : il refuse un certificat auto-signé (normal pour une clé d'app).
          jarsigner -J-Duser.language=en -verify "$AAB" | grep -q '^jar verified' \
            || { echo "::error::Signature de l'AAB invalide"; exit 1; }
          aab_cert="$(keytool -J-Duser.language=en -printcert -jarfile "$AAB" \
            | grep -m1 'SHA256:' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')"
          [ "$aab_cert" = "$EXPECTED_UPLOAD_CERT_SHA256" ] \
            || { echo "::error::AAB signé par $aab_cert, attendu $EXPECTED_UPLOAD_CERT_SHA256"; exit 1; }
          echo "AAB signé par $aab_cert"
          # L'APK non signé ne doit porter aucune signature.
          if "$APKSIGNER" verify "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" > /dev/null 2>&1; then
            echo "::error::L'APK « non signé » est signé"; exit 1
          fi

      - name: Préparer les artefacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/tamacookie-$VERSION_NAME.apk"
          cp "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" "dist/tamacookie-$VERSION_NAME-unsigned.apk"
          cp "$RUNNER_TEMP/signed/app-release.aab" "dist/tamacookie-$VERSION_NAME.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)

      - name: Artefact release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Publie la release — seul job avec le droit d'écriture, sans checkout ni secret de signature.
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Récupérer l'artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      # Le fichier publié doit être exactement celui qui a été vérifié dans le job build.
      - name: Contrôler les empreintes
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Publication GitHub
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: TamaCookie ${{ needs.build.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
