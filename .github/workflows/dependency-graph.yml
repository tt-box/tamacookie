name: Graphe de dépendances

# Soumet les dépendances résolues par Gradle à GitHub : les alertes Dependabot couvrent ainsi
# les bibliothèques transitives. À chaque push sur main et chaque semaine, comme gabuzomeu,
# MaMeteo et tvorlando.
on:
  push:
    branches: [main]
  # Les fusions automatiques Dependabot passent par GITHUB_TOKEN et ne déclenchent pas `push` :
  # l'exécution hebdomadaire remet l'instantané à jour après elles.
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Seul le dernier instantané compte : un nouveau push remplace le précédent.
concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-graph:
    name: Graphe de dépendances (alertes Dependabot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # contents: write est requis par l'API de soumission du graphe de dépendances.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
