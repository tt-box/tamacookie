org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Cache de build : une tâche dont les entrées n'ont pas changé reprend ses sorties au lieu de tourner. En CI, le
# cache (dans le Gradle User Home) est sauvegardé par setup-gradle depuis main et lu par les PR et la release.
org.gradle.caching=true
# Cache de configuration : le graphe des tâches est réutilisé tant que les scripts de build et leurs entrées
# (propriétés -P, variables d'environnement lues, keystore.properties) n'ont pas changé. En CI, il n'est conservé
# d'une exécution à l'autre qu'avec le secret GRADLE_ENCRYPTION_KEY (cache-encryption-key de setup-gradle).
org.gradle.configuration-cache=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Où trouver le JDK 21 du démon (gradle/gradle-daemon-jvm.properties) : JDK21_HOME en local, JAVA_HOME_21_X64
# posée par actions/setup-java en CI. Gradle ne détecte pas tout seul certains JDK (Microsoft Build of OpenJDK).
org.gradle.java.installations.fromEnv=JDK21_HOME,JAVA_HOME_21_X64
